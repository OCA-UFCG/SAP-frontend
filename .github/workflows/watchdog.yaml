name: Vigia do SEDES (alerta por e-mail)

# Instala o vigia nas duas VMs. Cada uma vigia o ambiente da outra, para a
# queda de uma VM inteira também gerar alerta. Roda quando o vigia muda na
# main ou quando alguém dispara à mão (aba Actions → Run workflow).
on:
  push:
    branches: [main]
    paths:
      - "scripts/watchdog/**"
      - ".github/workflows/watchdog.yaml"
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - watcher: a VM do beta (LSD)
            runner: sap-beta-runner
            target_name: SEDES produção
            url: https://sedes.oca-portal.com/api/health
            # ~2 min fora do ar até o e-mail; lembrete a cada 3 h enquanto durar.
            failures_before_alert: 2
            reminder_minutes: 180
          - watcher: a VM da produção (AWS)
            runner: sap-prod-runner
            target_name: SEDES beta
            url: https://beta-sap.lsd.ufcg.edu.br/api/health
            # O beta cai em todo deploy e é de teste: avisa mais tarde e sem lembrete.
            failures_before_alert: 3
            reminder_minutes: 0
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    steps:
      - uses: actions/checkout@v5

      - name: Test the watchdog
        run: python3 -m unittest discover -s scripts/watchdog

      - name: Install the watchdog and send a confirmation e-mail
        env:
          WATCHDOG_TARGET_NAME: ${{ matrix.target_name }}
          WATCHDOG_URL: ${{ matrix.url }}
          WATCHDOG_WATCHER: ${{ matrix.watcher }}
          WATCHDOG_FAILURES_BEFORE_ALERT: ${{ matrix.failures_before_alert }}
          WATCHDOG_REMINDER_MINUTES: ${{ matrix.reminder_minutes }}
          # Quem recebe os alertas. Sem ALERT_EMAIL_TO, vai para o e-mail do OCA.
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO || vars.OCA_NOTIFICATION_EMAIL }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
        run: sudo --preserve-env=WATCHDOG_TARGET_NAME,WATCHDOG_URL,WATCHDOG_WATCHER,WATCHDOG_FAILURES_BEFORE_ALERT,WATCHDOG_REMINDER_MINUTES,ALERT_EMAIL_TO,SMTP_USER,SMTP_PASSWORD,SMTP_FROM bash scripts/watchdog/install.sh
