name: CI SAP-Home Frontend

on:
  push:
    branches: ["*"]
    tags: ["*"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup npm
        run: npm install -g npm@11.8.0

      - name: Install Dependencies
        run: npm ci

      - name: Run CI verification
        env:
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_CONTENTFUL_PREVIEW: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_PREVIEW }}
          NEXT_PUBLIC_CONTENTFUL_PREVIEW_TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_PREVIEW_TOKEN }}
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_SPACE_ID }}
          # PRs do Dependabot e de forks não recebem os secrets do repositório, e
          # sem eles o índice de disponibilidade municipal não pode ser gerado a
          # partir do Contentful. Aqui o placeholder vazio é aceitável: este job
          # só verifica lint, testes e build. Os workflows de CD não definem esta
          # variável, então um deploy com secret faltando continua falhando alto.
          ALLOW_PLACEHOLDER_AVAILABILITY_INDEX: "true"
        run: npm run ci:verify
