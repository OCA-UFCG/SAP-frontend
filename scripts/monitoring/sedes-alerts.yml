# Alertas do SEDES no Prometheus da VM de monitoramento (oca-monitor).
#
# Cada alerta leva três anotações que o Alertmanager usa no e-mail: titulo
# (assunto enquanto dura), resolvido (assunto quando acaba) e descricao.
groups:
  - name: sedes
    rules:
      # Com a coleta a cada minuto, `for: 1m` é a segunda falha seguida
      # (~2 min fora até o e-mail): a troca de container de um deploy, que
      # derruba o site por alguns segundos, não vira alerta.
      - alert: SedesForaDoAr
        expr: up{job="sedes", ambiente="produção"} == 0
        for: 1m
        labels: &fora-do-ar
          severity: critical
        annotations: &fora-do-ar-texto
          titulo: fora do ar
          resolvido: voltou ao ar
          descricao: >-
            O SEDES {{ $labels.ambiente }} não respondeu em
            https://{{ $labels.instance }}/api/metrics. Se o site abre
            normalmente no navegador, o METRICS_TOKEN do container e o da VM
            de monitoramento podem ter ficado diferentes.
      # O beta cai em todo deploy e é de teste: avisa só na terceira falha.
      - alert: SedesForaDoAr
        expr: up{job="sedes", ambiente="beta"} == 0
        for: 2m
        labels: *fora-do-ar
        annotations: *fora-do-ar-texto

      # O site responde, mas um serviço de que ele depende não. Espera 3 min
      # porque uma lentidão de 2 min do Earth Engine em 21/10/2026 virou um
      # par de e-mails "fora" e "voltou" sem ninguém precisar agir.
      - alert: SedesServicoComProblema
        expr: sedes_dependency_up == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          titulo: serviço com problema
          resolvido: serviços normalizados
          descricao: >-
            O site está no ar, mas {{ $labels.servico }} {{ $labels.falha }}.
            O erro completo fica no log do container (docker logs), nas linhas
            com [health].

      # Disco cheio para os containers e derruba o site. Avisa a partir de
      # 85% e só considera resolvido abaixo de 80%, para um disco oscilando
      # em volta do limite não virar um e-mail por minuto.
      - alert: SedesDiscoQuaseCheio
        expr: >-
          sedes_disk_used_ratio >= 0.85
          or (sedes_disk_used_ratio >= 0.80
            and on(instance) ALERTS{alertname="SedesDiscoQuaseCheio", alertstate="firing"})
        for: 5m
        annotations:
          titulo: disco quase cheio
          resolvido: disco voltou ao normal
          descricao: >-
            O disco da VM do SEDES {{ $labels.ambiente }} está com
            {{ $value | humanizePercentage }} usado. O que costuma ocupar
            espaço são as imagens antigas do Docker (sudo docker system df) e
            os logs dos containers (sudo du -sh /var/lib/docker/containers/*).

      # Memória da VM quase no fim: o kernel começa a matar processos, e o
      # container do SEDES, o maior deles, costuma ser o escolhido.
      - alert: SedesMemoriaBaixa
        expr: sedes_memory_available_bytes / sedes_memory_total_bytes < 0.10
        for: 5m
        annotations:
          titulo: memória da VM quase no fim
          resolvido: memória da VM normalizada
          descricao: >-
            A VM do SEDES {{ $labels.ambiente }} está com só
            {{ $value | humanizePercentage }} da memória disponível. Quem está
            ocupando: sudo docker stats --no-stream. A memória do próprio
            servidor do SEDES fica em sedes_process_resident_memory_bytes no
            Prometheus (http://34.200.5.32:9090).

      # CPU ocupada por muito tempo deixa o site lento para todo mundo. O tempo
      # roubado pelo hipervisor entra como ocupado: na produção (AWS), é ele
      # que cresce quando a instância fica sem créditos de CPU.
      - alert: SedesCpuAlta
        expr: >-
          1 - rate(sedes_cpu_idle_seconds_total[5m])
            / rate(sedes_cpu_seconds_total[5m]) > 0.9
        for: 15m
        annotations:
          titulo: CPU da VM no limite
          resolvido: CPU da VM normalizada
          descricao: >-
            A CPU da VM do SEDES {{ $labels.ambiente }} está
            {{ $value | humanizePercentage }} ocupada há mais de 15 minutos.
            Quem está usando: sudo docker stats --no-stream. Se o top mostrar
            "st" alto, é falta de crédito de CPU da instância, não o SEDES.

      # A cota de API do Contentful é de 100 mil chamadas por mês para a
      # organização inteira: beta, produção, quem edita e scripts. Passando
      # dela, o espaço fica bloqueado até o fim do mês e o site perde o
      # conteúdo. Em outubro de 2026 o próprio monitor a levou a 82%. Os dois
      # ambientes publicam o mesmo número, então o alerta é um só.
      - alert: SedesCotaContentful
        expr: >-
          label_replace(
            max by (project) (sum by (project, ambiente) (sedes_contentful_api_requests_month))
              / on(project) max by (project) (sedes_contentful_api_requests_limit),
            "ambiente", "beta e produção", "", ""
          ) >= 0.7
        for: 10m
        annotations: &cota-texto
          titulo: cota de API do Contentful passou de 70%
          resolvido: cota de API do Contentful voltou ao normal
          descricao: >-
            A organização do Contentful já usou
            {{ $value | humanizePercentage }} das chamadas de API do mês. Em
            100%, o espaço fica bloqueado até o fim do mês e o site perde o
            conteúdo. O que os servidores do SEDES pediram aparece em
            increase(sedes_contentful_requests_total[1d]) no Prometheus
            (http://34.200.5.32:9090); o resto vem de quem edita no Contentful,
            do catálogo e de scripts. O uso por dia fica em Organization
            settings → Usage, no Contentful.
      - alert: SedesCotaContentfulNoFim
        expr: >-
          label_replace(
            max by (project) (sum by (project, ambiente) (sedes_contentful_api_requests_month))
              / on(project) max by (project) (sedes_contentful_api_requests_limit),
            "ambiente", "beta e produção", "", ""
          ) >= 0.9
        for: 10m
        labels:
          severity: critical
        annotations:
          <<: *cota-texto
          titulo: cota de API do Contentful passou de 90%
      # Avisa antes de chegar perto: no ritmo dos últimos 7 dias, o mês fecha
      # acima da cota.
      - alert: SedesCotaContentfulProjecao
        expr: >-
          label_replace(
            max by (project) (sedes_contentful_api_requests_month_projected)
              > on(project) max by (project) (sedes_contentful_api_requests_limit),
            "ambiente", "beta e produção", "", ""
          )
        for: 1h
        annotations:
          titulo: cota de API do Contentful vai estourar neste mês
          resolvido: projeção da cota do Contentful voltou ao normal
          descricao: >-
            No ritmo dos últimos 7 dias, a organização do Contentful fecha o mês
            com {{ $value | humanize }} chamadas de API, acima da cota de 100
            mil. Em 100%, o espaço fica bloqueado até o fim do mês e o site
            perde o conteúdo. O que os servidores do SEDES pediram aparece em
            increase(sedes_contentful_requests_total[1d]) no Prometheus
            (http://34.200.5.32:9090); o resto vem de quem edita no Contentful,
            do catálogo e de scripts.

      # Em 18/10/2026 o certificado da produção venceu sem aviso e o site
      # ficou 38 h fora. 14 dias dão tempo de renovar à mão se o automático
      # falhar.
      - alert: SedesCertificadoVencendo
        expr: probe_ssl_earliest_cert_expiry{job="sedes-certificado"} - time() < 14 * 86400
        for: 10m
        annotations:
          titulo: certificado HTTPS perto de vencer
          resolvido: certificado HTTPS renovado
          descricao: >-
            O certificado HTTPS de {{ $labels.instance }} vence em
            {{ $value | humanizeDuration }}. A renovação da produção é o
            sedes-oca-cert-renew.timer; a do beta, o certbot.timer.
