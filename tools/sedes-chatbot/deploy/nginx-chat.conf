# Trecho para o sap.conf do nginx do beta (/home/ubuntu/nginx/sap.conf na VM):
# o upstream vai no topo do arquivo, junto dos outros; as duas location vão
# dentro do server que escuta na 443, antes de "location /".
#
# Com `resolve`, o nginx sobe mesmo se o container do chat não existir, e
# acompanha o IP novo a cada deploy.

upstream sedes_chat {
    zone sedes_chat 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server sedes-chat-beta:3210 resolve;
}

    location = /chat {
        return 301 /chat/;
    }

    # A página só usa endereços relativos: /chat/api/... vira /api/... no chat.
    location /chat/ {
        proxy_pass http://sedes_chat/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # A resposta vem aos poucos (NDJSON); sem isto chega tudo no fim.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }
